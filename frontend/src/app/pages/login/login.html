<div class="auth-page">
  <div class="auth-card card">
    <h3 class="auth-title">{{ i18n.t('login.welcome') }}</h3>

    @if (error()) {
      <div class="error-msg">{{ error() }}</div>
    }

    <div class="form-field">
      <label>{{ i18n.t('common.email') }}</label>
      <input
        type="email"
        [placeholder]="i18n.t('common.emailExample')"
        [value]="email()"
        (input)="email.set($any($event.target).value)"
      />
    </div>

    <div class="form-field">
      <div class="label-row">
        <label>{{ i18n.t('common.password') }}</label>
        <a routerLink="/forgot-password" class="forgot-link">{{ i18n.t('login.forgot') }}</a>
      </div>
      <input
        type="password"
        placeholder="••••••••"
        [value]="password()"
        (input)="password.set($any($event.target).value)"
        (keyup.enter)="submit()"
      />
    </div>

    <button class="btn btn-primary w-full" (click)="submit()" [disabled]="loading()">
      @if (loading()) {
        <span class="spinner-sm"></span>
      }
      {{ i18n.t('login.submit') }}
    </button>

    <p class="auth-footer">
      {{ i18n.t('login.noAccount') }} <a routerLink="/register">{{ i18n.t('login.signUp') }}</a>
    </p>
  </div>
  <p class="terms">
    {{ i18n.t('login.agree') }} <a href="#">{{ i18n.t('common.terms') }}</a>
    {{ i18n.t('common.and') }} <a href="#">{{ i18n.t('common.privacy') }}</a
    >.
  </p>
</div>

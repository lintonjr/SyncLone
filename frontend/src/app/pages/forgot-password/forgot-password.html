<div class="auth-page">
  <div class="auth-card card">
    <h3 class="auth-title">{{ i18n.t('forgot.title') }}</h3>
    @if (sent()) {
      <div class="success-msg">{{ i18n.t('forgot.sent') }}</div>
    } @else {
      @if (error()) {
        <div class="error-msg">{{ error() }}</div>
      }
      <div class="form-field">
        <label>{{ i18n.t('common.email') }}</label>
        <input
          type="email"
          [placeholder]="i18n.t('common.emailExample')"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          (keyup.enter)="submit()"
        />
      </div>
      <button class="btn btn-primary w-full" (click)="submit()" [disabled]="loading()">
        @if (loading()) {
          <span class="spinner-sm"></span>
        }
        {{ i18n.t('forgot.submit') }}
      </button>
    }
    <p class="auth-footer">
      <a routerLink="/login">{{ i18n.t('forgot.back') }}</a>
    </p>
  </div>
</div>

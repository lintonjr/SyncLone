services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: manasync
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      # VPN (Cisco AnyConnect) não roteia a bridge do Docker: build usa a rede do host
      network: host
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3001
      JWT_SECRET: manasync_secret_key_change_in_production
      JWT_EXPIRES_IN: 7d
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: root123
      DB_NAME: manasync
      # Dono da plataforma: a conta com este e-mail é promovida a admin a cada
      # subida. É quem aprova as solicitações para organizar.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    ports:
      - "3001:3001"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      # VPN (Cisco AnyConnect) não roteia a bridge do Docker: build usa a rede do host
      network: host
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  mysql_data:
  backend_uploads:

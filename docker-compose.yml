services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: manasync
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Pub/sub do SSE entre processos e contador do rate limit — o mesmo papel do
  # ElastiCache Serverless em produção, na mesma versão (8.1). Sem porta no host e
  # sem volume: só o backend fala com ele, e nada nele precisa sobreviver a um
  # restart (contadores de tentativa e avisos em trânsito).
  valkey:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      # VPN (Cisco AnyConnect) não roteia a bridge do Docker: build usa a rede do host
      network: host
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      PORT: 3001
      JWT_SECRET: manasync_secret_key_change_in_production
      JWT_EXPIRES_IN: 7d
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: root123
      DB_NAME: manasync
      # Dono da plataforma: a conta com este e-mail é promovida a admin na subida,
      # só enquanto não existir admin nenhum. É quem aprova as solicitações.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # Local, sem TLS nem cluster. Em produção: rediss://… com VALKEY_CLUSTER=true
      # e credencial em VALKEY_USER/VALKEY_PASS (ver backend/src/lib/config.js).
      VALKEY_URL: redis://valkey:6379
    ports:
      - "3001:3001"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      # VPN (Cisco AnyConnect) não roteia a bridge do Docker: build usa a rede do host
      network: host
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  mysql_data:
  backend_uploads:
